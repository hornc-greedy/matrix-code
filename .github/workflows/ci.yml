name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Reject an unknown command with exit code 2
        run: |
          status=0
          target/${{ matrix.target }}/release/matrix-code unknown || status=$?
          test "$status" -eq 2
      - name: Package the binary with its licenses
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir matrix-code
          cp target/${{ matrix.target }}/release/matrix-code LICENSE assets/LICENSE-font matrix-code/
          tar -czf matrix-code-${{ matrix.target }}.tar.gz matrix-code
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: matrix-code-${{ matrix.target }}
          path: matrix-code-${{ matrix.target }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum matrix-code-*.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" matrix-code-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
